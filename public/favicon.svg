<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0282E"/>
      <stop offset="100%" stop-color="#2D6CDF"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6CDF"/>
      <stop offset="100%" stop-color="#5B9CFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>
  
  <!-- Glowing Dot (Accent Red) -->
  <circle cx="32" cy="19" r="5" fill="#E0282E" filter="url(#glow)"/>
  
  <!-- Stem of 'i' (Accent Blue) -->
  <rect x="27.5" y="28" width="9" height="21" rx="4.5" fill="url(#stemGrad)" filter="url(#glow)"/>
  
  <!-- Speed accent lines -->
  <path d="M14 44L22 44" stroke="#E0282E" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M42 20L50 20" stroke="#2D6CDF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>